<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0" stop-color="#FFF1E2"/>
      <stop offset="1" stop-color="#F9D6B4"/>
    </radialGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD866"/>
      <stop offset="1" stop-color="#E9B23A"/>
    </linearGradient>
    <clipPath id="frame"><rect width="512" height="512"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <!-- background -->
    <rect width="512" height="512" fill="url(#bg)"/>
    <circle cx="256" cy="236" r="190" fill="#FBE3CA"/>

    <!-- hoodie -->
    <path d="M70 512 C78 432 140 398 200 388 L312 388 C372 398 434 432 442 512 Z" fill="#3E5C7A"/>
    <path d="M196 388 C210 430 302 430 316 388 C300 372 212 372 196 388 Z" fill="#2E4762"/>
    <!-- hoodie strings -->
    <path d="M226 412 L220 468" stroke="#E9EEF4" stroke-width="6" stroke-linecap="round"/>
    <path d="M286 412 L292 468" stroke="#E9EEF4" stroke-width="6" stroke-linecap="round"/>
    <circle cx="220" cy="472" r="6" fill="#E9EEF4"/>
    <circle cx="292" cy="472" r="6" fill="#E9EEF4"/>
    <!-- little wrench badge -->
    <g transform="translate(352 446) rotate(-35)">
      <rect x="-5" y="-4" width="10" height="34" rx="5" fill="#F08A3E"/>
      <circle cx="0" cy="-8" r="13" fill="#F08A3E"/>
      <rect x="-5" y="-24" width="10" height="14" fill="#3E5C7A"/>
    </g>

    <!-- neck -->
    <path d="M222 330 L222 392 C236 404 276 404 290 392 L290 330 Z" fill="#E9B48E"/>

    <!-- back hair (behind head) -->
    <g fill="url(#hair)">
      <circle cx="160" cy="210" r="40"/>
      <circle cx="352" cy="210" r="40"/>
      <circle cx="150" cy="250" r="30"/>
      <circle cx="362" cy="250" r="30"/>
    </g>

    <!-- ears -->
    <circle cx="150" cy="268" r="24" fill="#F2BF98"/>
    <circle cx="362" cy="268" r="24" fill="#F2BF98"/>
    <path d="M144 262 C154 258 156 276 148 278" stroke="#D99B74" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M368 262 C358 258 356 276 364 278" stroke="#D99B74" stroke-width="4" fill="none" stroke-linecap="round"/>

    <!-- face -->
    <ellipse cx="256" cy="252" rx="108" ry="120" fill="#F6CBA8"/>
    <!-- jaw shading / light stubble for a ~30 y.o. look -->
    <path d="M178 312 C196 360 228 372 256 372 C284 372 316 360 334 312 C318 344 290 356 256 356 C222 356 194 344 178 312 Z" fill="#E7B28E" opacity="0.6"/>

    <!-- curly front hair -->
    <g fill="url(#hair)" stroke="#D9A02E" stroke-width="3">
      <circle cx="176" cy="160" r="34"/>
      <circle cx="214" cy="132" r="36"/>
      <circle cx="258" cy="122" r="38"/>
      <circle cx="302" cy="132" r="36"/>
      <circle cx="340" cy="160" r="34"/>
      <circle cx="158" cy="198" r="26"/>
      <circle cx="354" cy="198" r="26"/>
      <circle cx="198" cy="168" r="24"/>
      <circle cx="236" cy="156" r="26"/>
      <circle cx="276" cy="156" r="26"/>
      <circle cx="314" cy="168" r="24"/>
    </g>
    <!-- curl swirls -->
    <g fill="none" stroke="#C98A1F" stroke-width="4" stroke-linecap="round" opacity="0.75">
      <path d="M206 128 c8 -8 20 -2 16 8 c-3 7 -12 6 -12 0"/>
      <path d="M252 116 c8 -8 20 -2 16 8 c-3 7 -12 6 -12 0"/>
      <path d="M298 128 c8 -8 20 -2 16 8 c-3 7 -12 6 -12 0"/>
      <path d="M168 156 c8 -8 20 -2 16 8 c-3 7 -12 6 -12 0"/>
      <path d="M334 156 c8 -8 20 -2 16 8 c-3 7 -12 6 -12 0"/>
      <path d="M230 154 c7 -7 17 -2 14 7"/>
      <path d="M270 154 c7 -7 17 -2 14 7"/>
    </g>
    <!-- hair highlights -->
    <g fill="#FFF0B0" opacity="0.8">
      <ellipse cx="246" cy="104" rx="12" ry="6" transform="rotate(-20 246 104)"/>
      <ellipse cx="200" cy="116" rx="9" ry="5" transform="rotate(-30 200 116)"/>
      <ellipse cx="292" cy="114" rx="9" ry="5" transform="rotate(-10 292 114)"/>
    </g>

    <!-- eyebrows (raised, cheerful) -->
    <path d="M186 214 Q210 198 234 210" stroke="#C98A1F" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M278 210 Q302 198 326 214" stroke="#C98A1F" stroke-width="8" fill="none" stroke-linecap="round"/>

    <!-- happy closed eyes -->
    <path d="M194 260 Q211 240 228 260" stroke="#3A2A22" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M284 260 Q301 240 318 260" stroke="#3A2A22" stroke-width="7" fill="none" stroke-linecap="round"/>

    <!-- clear-frame glasses -->
    <g>
      <!-- arms -->
      <path d="M166 250 L148 256" stroke="#B9C7D6" stroke-width="7" stroke-linecap="round" opacity="0.9"/>
      <path d="M346 250 L364 256" stroke="#B9C7D6" stroke-width="7" stroke-linecap="round" opacity="0.9"/>
      <!-- lenses -->
      <rect x="168" y="216" width="86" height="76" rx="30" fill="#FFFFFF" fill-opacity="0.22" stroke="#C9D5E2" stroke-opacity="0.95" stroke-width="9"/>
      <rect x="258" y="216" width="86" height="76" rx="30" fill="#FFFFFF" fill-opacity="0.22" stroke="#C9D5E2" stroke-opacity="0.95" stroke-width="9"/>
      <!-- inner edge so the clear frame reads -->
      <rect x="168" y="216" width="86" height="76" rx="30" fill="none" stroke="#8FA3B8" stroke-width="2" opacity="0.7"/>
      <rect x="258" y="216" width="86" height="76" rx="30" fill="none" stroke="#8FA3B8" stroke-width="2" opacity="0.7"/>
      <!-- bridge -->
      <path d="M252 246 Q256 238 260 246" stroke="#C9D5E2" stroke-width="7" fill="none" stroke-linecap="round"/>
      <!-- glints -->
      <path d="M182 236 L198 226" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.85"/>
      <path d="M272 236 L288 226" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.85"/>
    </g>

    <!-- blush -->
    <ellipse cx="186" cy="308" rx="20" ry="11" fill="#F29C8C" opacity="0.5"/>
    <ellipse cx="326" cy="308" rx="20" ry="11" fill="#F29C8C" opacity="0.5"/>

    <!-- nose -->
    <path d="M252 284 Q244 304 258 306" stroke="#D99B74" stroke-width="5" fill="none" stroke-linecap="round"/>

    <!-- big happy smile -->
    <path d="M212 322 Q256 378 300 322 Z" fill="#7A2E2E"/>
    <path d="M220 324 L292 324 Q290 336 284 340 L228 340 Q222 336 220 324 Z" fill="#FFFFFF"/>
    <path d="M236 352 Q256 342 276 352 Q266 362 256 362 Q246 362 236 352 Z" fill="#F07C7C"/>
    <path d="M212 322 Q256 378 300 322" stroke="#5E2222" stroke-width="4" fill="none" stroke-linejoin="round"/>
  </g>
</svg>
